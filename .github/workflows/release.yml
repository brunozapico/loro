name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    # FoundationModels is part of the macOS 26 SDK. Building on an older
    # runner silently compiles Loro's fallback path and produces a binary that
    # incorrectly reports macOS 26 as unsupported at runtime.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: test
        run: swift test -Xswiftc -DLORO_RELEASE_REQUIRES_FOUNDATION_MODELS

      - name: build
        run: swift build -c release --arch arm64 -Xswiftc -DLORO_RELEASE_REQUIRES_FOUNDATION_MODELS

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/loro
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/loro

      - name: strip
        run: strip -x dist/loro

      - name: package
        run: |
          cd dist
          tar -czf loro-macos-arm64.tar.gz loro
          shasum -a 256 loro-macos-arm64.tar.gz > loro-macos-arm64.tar.gz.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/loro-macos-arm64.tar.gz
            dist/loro-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
