name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    # FoundationModels is part of the macOS 26 SDK. Building on an older
    # runner silently compiles Loro's fallback path and produces a binary that
    # incorrectly reports macOS 26 as unsupported at runtime.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: test
        run: scripts/test.sh

      # Never publish a new ad-hoc identity as an update. Release certificates
      # must be provisioned persistently; local releases use the maintainer's key.
      - name: build application and installers
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          LORO_ALLOW_ADHOC: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION=0.3.1; fi
          scripts/build-app.sh "$VERSION"

      - name: upload test installers
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Loro-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
